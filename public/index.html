<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>NYSA CRM</title>
<style>
 :root{
  --bg:#f5f4ef;--panel:#ffffff;--panel2:#f0efe9;--border:#deddd5;--text:#20241f;--muted:#73786f;
  --gold:#a68443;--gold-dim:#80672f;--green:#397456;--amber:#a66d22;--red:#a94f42;--blue:#426d8a;
  --radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
 body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:16.1px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
 input,select,textarea{font-family:inherit;font-size:14.95px;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:7px 10px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gold-dim)}
label{display:block;font-size:12.65px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
 .btn{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:8px 16px;border-radius:6px;font-size:14.95px;transition:all .15s}
.btn:hover{border-color:var(--gold-dim)}
 .btn-primary{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600}
.btn-primary:hover{background:#d9bd7e}
.btn-danger{color:var(--red);border-color:#4a332e}
.btn-sm{padding:4px 10px;font-size:13.8px}
.hidden{display:none!important}
 header{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;padding:16px 28px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.96);position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;justify-self:start}
.brand-logo{display:block;width:auto;height:58px}
.system-name{justify-self:center;color:var(--gold);font-size:39.1px;font-weight:600;line-height:1;letter-spacing:.32em;padding-left:.32em}
.userbox{display:flex;align-items:center;justify-self:end;gap:12px;font-size:14.95px}
.userbox .role{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);border:1px solid var(--gold-dim);border-radius:20px;padding:2px 10px}
 nav.tabs{display:flex;gap:4px;padding:0 28px;border-bottom:1px solid var(--border);background:var(--panel)}
nav.tabs button{background:none;border:none;color:var(--muted);padding:12px 18px;font-size:14.95px;border-bottom:2px solid transparent;letter-spacing:.03em}
nav.tabs button.active{color:var(--text);border-bottom-color:var(--gold)}
main{padding:22px 28px;max-width:1500px;margin:0 auto}
/* login */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:38px;width:400px}
.auth-card h1{font-size:23px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;text-align:center}
.auth-card .sub{text-align:center;color:var(--muted);font-size:13.8px;margin:6px 0 26px;letter-spacing:.05em}
.auth-card .field{margin-bottom:14px}
.auth-card .switch{text-align:center;margin-top:18px;font-size:13.8px;color:var(--muted)}
.auth-card .switch a{color:var(--gold);cursor:pointer;text-decoration:none}
.error-msg{background:#3a2420;border:1px solid #5a382f;color:#e8a598;padding:9px 12px;border-radius:6px;font-size:13.8px;margin-bottom:14px}
.info-msg{background:#20303a;border:1px solid #2f4a5a;color:#98c8e8;padding:9px 12px;border-radius:6px;font-size:13.8px;margin-bottom:14px}
/* filters */
.filterbar{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:18px}
.filter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.filter-actions{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.result-count{color:var(--muted);font-size:13.8px;margin-left:auto}
/* cards */
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:border-color .15s;position:relative}
.card:hover{border-color:var(--gold-dim)}
.card h3{font-size:17.25px;margin-bottom:2px;padding-right:80px}
.card .meta{color:var(--muted);font-size:13.8px;margin-bottom:10px}
.card .price{font-size:20.7px;color:var(--gold);font-weight:600}
.card .price small{color:var(--muted);font-weight:400;font-size:12.65px}
.card .specs{display:flex;gap:14px;color:var(--muted);font-size:13.8px;margin:8px 0}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.badge{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:20px;border:1px solid var(--border);color:var(--muted)}
.badge.status-Available{color:var(--green);border-color:#2e4a3c}
.badge.status-Reserved{color:var(--amber);border-color:#4a3f28}
.badge.status-Under.offer,.badge.under-offer{color:var(--blue);border-color:#2e3d4a}
.badge.status-Closed{color:var(--red);border-color:#4a332e}
.badge.tier{color:var(--gold);border-color:var(--gold-dim)}
.discount-tag{position:absolute;top:14px;right:14px;background:#233527;color:var(--green);font-size:12.65px;font-weight:600;padding:3px 8px;border-radius:5px}
.comment-ct{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12.65px;border-top:1px solid var(--border);margin-top:13px;padding-top:9px}.comment-ct span:nth-child(2){margin-left:auto}.comment-ct b{color:var(--gold-dim);font-weight:600}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(6,8,12,.75);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;width:100%;max-width:760px;padding:26px}
.modal h2{font-size:19.55px;margin-bottom:16px;color:var(--gold);letter-spacing:.04em}
.modal .close-x{float:right;background:none;border:none;color:var(--muted);font-size:23px}
.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.form-grid .span2{grid-column:span 2}.form-grid .span3{grid-column:span 3}
.bulk-unit-row{display:grid;grid-template-columns:1.1fr 1fr .8fr 1fr 1fr auto;gap:10px;align-items:start;border:1px solid var(--border);background:var(--panel2);padding:12px;margin:10px 0}.bulk-unit-row>div>label{display:flex;align-items:flex-end;min-height:3.2em}.bulk-unit-row [data-amount-preview]{display:block;min-height:2.8em}.bulk-unit-row .btn{margin-top:3.2em}.bulk-deal-total{display:flex;justify-content:flex-end;align-items:center;gap:14px;margin:10px 0;padding:10px 12px;border:1px solid var(--border);background:var(--panel)}.bulk-deal-total span{color:var(--muted)}.bulk-deal-total b{color:var(--gold);font-size:1.15rem}.bulk-unit-summary{margin:14px 0;overflow-x:auto}.bulk-unit-summary table{min-width:720px}.bulk-unit-summary td,.bulk-unit-summary th{vertical-align:middle}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
/* detail */
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.detail-price{font-size:27.6px;color:var(--gold);font-weight:600}
.kv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0;background:var(--panel2);border-radius:8px;padding:16px}
.kv-grid div b{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:2px}
.notes-block{background:var(--panel2);border-left:3px solid var(--gold-dim);border-radius:6px;padding:12px;margin-bottom:16px;font-size:14.95px;color:#cfccc5}
/* comments */
.comments{border-top:1px solid var(--border);margin-top:18px;padding-top:16px}
.comments h3{font-size:14.95px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:12px}
.comment{padding:10px 0;border-bottom:1px solid #20242e}
.comment .c-head{display:flex;gap:8px;align-items:baseline;font-size:13.8px}
.comment .c-head b{color:var(--text)}
.comment .c-head span{color:var(--muted);font-size:12.65px}
.comment p{margin-top:3px;font-size:14.95px;color:#cfccc5}
.comment .c-actions{margin-top:4px;display:flex;gap:10px}
.comment .c-actions a{font-size:12.65px;color:var(--muted);cursor:pointer}
.comment .c-actions a:hover{color:var(--gold)}
.comment-form{display:flex;gap:10px;margin-top:14px}
/* tables */
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
th{font-size:12.65px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--panel2)}
td{padding:10px 14px;border-bottom:1px solid #20242e;font-size:14.95px}
tr:last-child td{border-bottom:none}
.admin-section{margin-bottom:30px}
.admin-section h2{font-size:16.1px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);margin-bottom:12px}

.admin-toolbar{display:flex;gap:10px;margin-bottom:12px;align-items:end;flex-wrap:wrap}
